<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1730">
<meta name="robots" content="noindex, nofollow">
<title>Mes départs</title>
<style>
:root{--bg:#0E1730;--panel:#16213F;--line:#25325A;--fg:#F2F4FA;--muted:#9AA6C6;--bad:#FF6B6B;--amber:#FFB86B;
 --grad:linear-gradient(120deg,#3DD6C4 0%,#8EA8FF 55%,#A78BFA 100%);color-scheme:dark}
:root[data-theme="light"]{--bg:#F3F5FB;--panel:#FFFFFF;--line:#DDE2EF;--fg:#141B33;--muted:#5D6787;--bad:#D63434;--amber:#DB8418;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px 16px}
main{width:100%;max-width:360px;text-align:center}
main[hidden]{display:none}
.ic{width:64px;height:64px;margin:0 auto 16px;border-radius:20px;display:grid;place-items:center;background:var(--grad);color:#10162B}
h1{margin:0 0 6px;font-size:26px;letter-spacing:-.01em}
p{margin:0 0 22px;color:var(--muted);font-size:15px}
form{display:flex;flex-direction:column;gap:10px}
input{height:50px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:0 16px;font:16px system-ui,-apple-system,sans-serif;text-align:center}
input:focus{outline:2px solid #8EA8FF;outline-offset:1px}
button{height:50px;border:0;border-radius:13px;background:var(--grad);color:#10162B;font:700 17px system-ui,-apple-system,sans-serif;cursor:pointer}
button:disabled{opacity:.55}
.msg{min-height:20px;margin-top:4px;font-size:14px;font-weight:600;color:var(--muted)}
.msg.bad{color:var(--bad)}
small{display:block;margin-top:18px;color:var(--muted);font-size:13px}
</style>
<script>
(function(){var t='auto';try{t=(JSON.parse(localStorage.getItem('mes-departs-cfg')||'{}')||{}).theme||'auto'}catch(e){}
 if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t)})();
</script>
</head>
<body>
<main id="lock" hidden>
 <div class="ic"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg></div>
 <h1>Mes départs</h1>
 <p>Application privée. Cet appareil n'est pas encore autorisé.</p>
 <form id="f" autocomplete="on">
  <input type="text" name="username" value="Mes départs" autocomplete="username" hidden>
  <input id="code" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Code d'accès" aria-label="Code d'accès">
  <button id="go" type="submit">Autoriser cet appareil</button>
  <div class="msg" id="msg" role="status"></div>
 </form>
 <small>Le code n'est demandé qu'une seule fois sur cet appareil.</small>
</main>
<script>
(function(){
 var P=null,S=window.crypto&&crypto.subtle,DB='mes-departs-lock',LS='mes-departs-dev';
 function b64b(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
 function bb64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
 function norm(c){return String(c||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
 function db(){return new Promise(function(ok,ko){var r=indexedDB.open(DB,1);r.onupgradeneeded=function(){r.result.createObjectStore('k')};r.onsuccess=function(){ok(r.result)};r.onerror=function(){ko(r.error)}})}
 function idbGet(){return db().then(function(d){return new Promise(function(ok,ko){var q=d.transaction('k').objectStore('k').get('dev');q.onsuccess=function(){ok(q.result||null)};q.onerror=function(){ko(q.error)}})})}
 function idbPut(k){return db().then(function(d){return new Promise(function(ok,ko){var t=d.transaction('k','readwrite');t.objectStore('k').put(k,'dev');t.oncomplete=function(){ok()};t.onerror=function(){ko(t.error)}})})}
 function open(key){return S.decrypt({name:'AES-GCM',iv:b64b(P.iv)},key,b64b(P.c)).then(function(b){return new TextDecoder().decode(b)})}
 function show(html){document.open();document.write(html);document.close()}
 function stored(){
  return idbGet().catch(function(){return null}).then(function(k){
   if(k)return k;var raw=null;try{raw=localStorage.getItem(LS)}catch(e){}
   return raw?S.importKey('raw',b64b(raw),{name:'AES-GCM'},false,['decrypt']):null});
 }
 function lockUI(){document.getElementById('lock').hidden=false;setTimeout(function(){document.getElementById('code').focus()},50)}
 if(!S){lockUI();document.getElementById('msg').textContent='Ouvre l’application en https.';return}
 /* l'appli chiffrée est rechargée à chaque ouverture (jamais de vieille version en cache) */
 /* l'appli chiffrée est aussi gardée sur le téléphone : elle s'ouvre même sans réseau (métro, tunnel) */
 function getP(){
  var saved=function(){var t=null;try{t=localStorage.getItem('app-json')}catch(e){}if(!t)throw 0;window.OFFLINE_APP=1;return JSON.parse(t)};
  return fetch('app.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()})
   .then(function(t){try{localStorage.setItem('app-json',t)}catch(e){}return JSON.parse(t)},function(){try{return saved()}catch(e){return fetch('app.json').then(function(r){if(!r.ok)throw 0;return r.json()})}})
   .then(function(x){P=x;return x})}
 var ready=getP();
 ready.then(stored).then(function(k){if(!k)return lockUI();return open(k).then(show,lockUI)}).catch(function(){lockUI();if(!P)document.getElementById('msg').textContent='Pas de réseau : réessaie dans un instant.'});
 document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();var inp=document.getElementById('code'),msg=document.getElementById('msg'),go=document.getElementById('go');
  if(!inp.value.trim()){inp.focus();return}
  go.disabled=true;msg.className='msg';msg.textContent='Vérification…';
  (P?Promise.resolve(P):getP()).then(function(){return S.importKey('raw',new TextEncoder().encode(norm(inp.value)),'PBKDF2',false,['deriveBits'])})
   .then(function(k){return S.deriveBits({name:'PBKDF2',salt:b64b(P.s),iterations:P.n,hash:'SHA-256'},k,256)})
   .then(function(bits){
    return S.importKey('raw',bits,{name:'AES-GCM'},false,['decrypt']).then(function(key){
     return open(key).then(function(html){
      /* clé gardée sur cet appareil : non exportable dans IndexedDB, sinon en secours dans le stockage local */
      return idbPut(key).then(function(){return idbGet()}).then(function(k){if(!k)throw 0})
       .catch(function(){try{localStorage.setItem(LS,bb64(bits))}catch(x){}})
       .then(function(){show(html)});
     });
    });
   }).catch(function(){go.disabled=false;msg.className='msg bad';msg.textContent='Code incorrect, réessaie.';inp.select()});
 });
})();
</script>
</body>
</html>
